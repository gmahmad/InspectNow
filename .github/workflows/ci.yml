name: InspectNow CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: inspectnow_tests
          POSTGRES_USER: inspectnow_ci
          # Disposable CI container credential, never a real environment password.
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inspectnow_ci -d inspectnow_tests"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ConnectionStrings__InspectNow: Host=localhost;Port=5432;Database=inspectnow_tests;Username=inspectnow_ci;Password=ci_only_password
      ConnectionStrings__InspectNowTests: Host=localhost;Port=5432;Database=inspectnow_tests;Username=inspectnow_ci;Password=ci_only_password
      DOTNET_NOLOGO: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore InspectNow.slnx
      - name: Build
        run: dotnet build InspectNow.slnx --configuration Release --no-restore
      - name: Test (unit and real PostgreSQL integration)
        run: dotnet test InspectNow.slnx --configuration Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory TestResults
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 7
