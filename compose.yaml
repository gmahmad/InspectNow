name: inspectnow-local

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: inspectnow_admin
      POSTGRES_DB: inspectnow
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets:
      - postgres_admin_password
      - app_db_password
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      # PostgreSQL 18 stores versioned data below this parent directory.
      - postgres_data:/var/lib/postgresql
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/01-inspectnow.sh:ro
    healthcheck:
      # Force TCP: do not declare the temporary initialization server healthy.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U inspectnow_admin -d inspectnow"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  migrate:
    image: inspectnow-api:local
    build:
      context: .
      dockerfile: Dockerfile
    command: ["--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__InspectNow: Host=db;Port=5432;Database=inspectnow;Username=inspectnow_app
      Database__PasswordFile: /run/secrets/app_db_password
    secrets:
      - app_db_password
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: inspectnow-api:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Http__UseHttpsRedirection: "false"
      ConnectionStrings__InspectNow: Host=db;Port=5432;Database=inspectnow;Username=inspectnow_app
      Database__PasswordFile: /run/secrets/app_db_password
    secrets:
      - app_db_password
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:

secrets:
  postgres_admin_password:
    file: ./docker/secrets/postgres-admin-password.txt
  app_db_password:
    file: ./docker/secrets/app-db-password.txt
